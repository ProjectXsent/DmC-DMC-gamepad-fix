; dmc-sdl-controller configuration. Place next to xinput1_3.dll (the game folder).
; Lines starting with ; or # are comments. Changes apply on the next game launch.

[General]
; hybrid      = genuine XInput pads work exactly as before; any other pad that SDL
;               recognises (PS4/PS5, Switch Pro, generic) fills the first free slot.
; sdl         = only SDL pads are used (real XInput is ignored).
; passthrough = shim does nothing (useful to rule it out when troubleshooting).
mode = hybrid

; In hybrid mode, let an SDL pad take priority over a real XInput pad in the same slot.
prefer_sdl = false

; Xbox-type pads are already served by real XInput; skip them in SDL to avoid duplicates.
ignore_xbox_pads = true

; The game reads pads through DirectInput as well as XInput, so a physical pad appears
; twice and button prompts flip between generic "Button N" and Xbox glyphs. With this on,
; the dinput8.dll proxy hides gamepad-class devices from the game's DirectInput
; (keyboard and mouse are untouched). Ignored when mode = passthrough.
hide_dinput_pads = true

; Write dmc_sdl.log (and dmc_sdl_dinput.log) next to the DLLs next to the DLL (device detection, mapping, errors).
log = false

; Extra SDL controller mappings (SDL_GameControllerDB format), relative to this folder.
mappings_file = gamecontrollerdb.txt

[Input]
; Positional mapping is the default: the bottom face button is always "A".
; Swap these if you want button *labels* to match on a Nintendo-layout pad.
swap_ab = false
swap_xy = false

; Radial deadzones / trigger threshold as percentages (0-99). 0 = leave it to the game.
left_deadzone = 0
right_deadzone = 0
trigger_threshold = 0

; Rumble strength in percent (0-200; the result is clamped to the hardware maximum).
rumble_scale = 100

[Hints]
; Raw SDL hints, one per line: NAME = VALUE. Applied before SDL starts.
; Example: SDL_JOYSTICK_HIDAPI_PS5_PLAYER_LED = 0
